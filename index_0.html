<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MASK STREAM</title>
<script>
import { GoogleGenAI } from "@google/genai";

const ai = new GoogleGenAI({});

async function main() {
  const response = await ai.models.generateContent({
    model: "gemini-3-flash-preview",
    contents: "Explain how AI works in a few words",
  });
  console.log(response.text);
}

await main();


 </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
}

#game {
  width: 360px;
  height: 640px;
  background: #1a1a1a;
  display: flex;
  flex-direction: column;
}

#stats {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #222;
  font-size: 14px;
}

#prompt {
  padding: 10px;
  background: #2a2a2a;
  font-size: 14px;
  text-align: center;
  border-bottom: 1px solid #333;
}

#face {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 120px;
  transition: transform 0.2s;
}

.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

#chat {
  height: 160px;
  overflow-y: auto;
  background: #000;
  padding: 8px;
  font-size: 13px;
}

.chat-line {
  margin-bottom: 6px;
  opacity: 0.9;
}

#controls {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  background: #222;
}

.mask {
  font-size: 28px;
  cursor: pointer;
  opacity: 0.6;
}

.mask:hover {
  opacity: 1;
}
</style>
</head>

<body>
<div id="game">

  <div id="stats">
    <div>👁️ <span id="viewers">42</span></div>
    <div>💸 $<span id="tips">0</span></div>
  </div>

  <div id="prompt">Waiting for direction…</div>

  <div id="face">😐</div>

  <div id="chat"></div>

  <div id="controls">
    <div class="mask" data-mask="😊">😊</div>
    <div class="mask" data-mask="😏">😏</div>
    <div class="mask" data-mask="😐">😐</div>
    <div class="mask" data-mask="😡">😡</div>
    <div class="mask" data-mask="😢">😢</div>
    <div class="mask" data-mask="🤡">🤡</div>
  </div>

</div>

<script>
const face = document.getElementById("face");
const chat = document.getElementById("chat");
const viewersEl = document.getElementById("viewers");
const tipsEl = document.getElementById("tips");
const promptEl = document.getElementById("prompt");

let viewers = 42;
let tips = 0;
let burnout = 0;

const events = [
  {
    prompt: "Tell chat you really appreciate them.",
    comment: "awww say it again",
    correct: "😊",
    forbidden: ["😡", "🤡"]
  },
  {
    prompt: "Respond calmly to criticism.",
    comment: "this stream is mid",
    correct: "😐",
    forbidden: ["😡", "🤡"]
  },
  {
    prompt: "Act excited no matter what.",
    comment: "why are you even here",
    correct: "🤡",
    forbidden: ["😢", "😐"]
  },
  {
    prompt: "Handle a lonely viewer gently.",
    comment: "i feel invisible",
    correct: "😢",
    forbidden: ["🤡", "😏"]
  },
  {
    prompt: "Flirt back without crossing a line.",
    comment: "notice me please",
    correct: "😏",
    forbidden: ["😡", "🤡"]
  },
  {
    prompt: "Deflect hate without reacting.",
    comment: "you look fake",
    correct: "😐",
    forbidden: ["😡"]
  }
];

let currentEvent = null;

function addChat(text) {
  const line = document.createElement("div");
  line.className = "chat-line";
  line.textContent = text;
  chat.appendChild(line);
  chat.scrollTop = chat.scrollHeight;
}

function spawnEvent() {
  currentEvent = events[Math.floor(Math.random() * events.length)];
  promptEl.textContent = "🎤 " + currentEvent.prompt;
  addChat("💬 " + currentEvent.comment);
}

function react(mask) {
  if (!currentEvent) return;

  face.textContent = mask;
  face.classList.add("shake");
  setTimeout(() => face.classList.remove("shake"), 300);

  let viewerDelta = 0;

  if (currentEvent.forbidden.includes(mask)) {
    viewerDelta = -8;
    addChat("😠 chat is offended");
  } 
  else if (mask === currentEvent.correct) {
    viewerDelta = +4;
    tips += Math.floor(Math.random() * 3) + 1;
    addChat("💸 tip sent!");
  } 
  else {
    viewerDelta = -3;
    addChat("👁️ viewers lose interest");
  }

  burnout++;
  if (burnout > 4) {
    viewerDelta -= 5;
    addChat("😬 emotional burnout showing");
  }

  viewers = Math.max(0, viewers + viewerDelta);
  viewersEl.textContent = viewers;
  tipsEl.textContent = tips;

  currentEvent = null;
  promptEl.textContent = "Waiting for direction…";

  if (viewers === 0) {
    alert("STREAM ENDED 💀");
    location.reload();
  }
}

document.querySelectorAll(".mask").forEach(m =>
  m.onclick = () => react(m.dataset.mask)
);

setInterval(spawnEvent, 2500);
</script>
</body>
</html>
